<title>Гит-квест</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: top status bar (level + XP), left level map drawn as a commit graph, right lesson stage: theory → practice sandbox → quiz */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --surface2:#e9eee8; --fg:#18201b; --muted:#5a6860; --line:#d3dad3;
  --accent:#1d7a52; --accent-fg:#ffffff; --accent-soft:#dcefe5;
  --gold:#b7791f; --gold-soft:#f8ecd6; --bad:#c2410c; --bad-soft:#fbe5da; --info:#2f5fb3; --info-soft:#e1e9f8;
  --term-bg:#151b18; --term-fg:#dbe6df; --term-dim:#8fa197; --term-ok:#6fd6a2; --term-err:#ff9a76; --term-warn:#f2c46a;
  --lane0:#1d7a52; --lane1:#2f5fb3; --lane2:#b7791f; --lane3:#a23d8a;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121715; --surface:#1a201d; --surface2:#222a26; --fg:#e4ebe6; --muted:#9aa9a0; --line:#2f3934;
  --accent:#4cc88e; --accent-fg:#0d1511; --accent-soft:#1b3328;
  --gold:#f0b44c; --gold-soft:#372b17; --bad:#ff8a5c; --bad-soft:#3a2219; --info:#7ea7f0; --info-soft:#1c2740;
  --term-bg:#0b0f0d; --term-fg:#dbe6df; --term-dim:#7d8f85; --term-ok:#6fd6a2; --term-err:#ff9a76; --term-warn:#f2c46a;
  --lane0:#4cc88e; --lane1:#7ea7f0; --lane2:#f0b44c; --lane3:#e07bc8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1a201d; --surface2:#222a26; --fg:#e4ebe6; --muted:#9aa9a0; --line:#2f3934;
  --accent:#4cc88e; --accent-fg:#0d1511; --accent-soft:#1b3328;
  --gold:#f0b44c; --gold-soft:#372b17; --bad:#ff8a5c; --bad-soft:#3a2219; --info:#7ea7f0; --info-soft:#1c2740;
  --term-bg:#0b0f0d; --term-fg:#dbe6df; --term-dim:#7d8f85; --term-ok:#6fd6a2; --term-err:#ff9a76; --term-warn:#f2c46a;
  --lane0:#4cc88e; --lane1:#7ea7f0; --lane2:#f0b44c; --lane3:#e07bc8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,kbd{font:.9em var(--f-mono);background:var(--accent-soft);padding:1px 5px;border-radius:4px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{font:800 18px/1 var(--f-display);letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.logo svg{width:26px;height:26px}
.lvl{display:flex;align-items:center;gap:10px;flex:1;min-width:220px}
.lvl-badge{font:700 13px/1 var(--f-display);background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:7px 11px;white-space:nowrap}
.lvl-name{font-weight:600;white-space:nowrap}
.xpbar{flex:1;height:10px;background:var(--surface2);border-radius:999px;overflow:hidden;min-width:80px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));width:0;transition:width .6s}
.xptext{font:600 12px var(--f-mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.badges-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;display:flex;gap:6px;align-items:center}
.badges-btn b{font-family:var(--f-mono)}

.wrap{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:270px minmax(0,1fr);gap:32px;padding-block:28px 80px}

/* level map */
.map{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start}
.map h2{font:600 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:4px 0 14px}
.map ol{list-style:none;margin:0;padding:0;position:relative}
.map ol::before{content:"";position:absolute;left:17px;top:18px;bottom:18px;width:3px;background:var(--line);border-radius:2px}
.map li{position:relative}
.map button{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:6px 6px 6px 0;border-radius:10px}
.map button:hover .node{transform:scale(1.08)}
.node{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:3px solid var(--line);font:700 13px var(--f-display);color:var(--muted);position:relative;z-index:1;transition:transform .15s}
.map .done .node{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.map .next .node{border-color:var(--accent);color:var(--accent);animation:pulse 1.8s infinite}
.map .cur button{background:var(--surface)}
.map .cur .node{box-shadow:0 0 0 4px var(--accent-soft)}
.mt{display:block;font-size:14px;font-weight:600;line-height:1.25}
.ms{display:block;font-size:12px;color:var(--gold);letter-spacing:2px;height:16px}
.ms .off{color:var(--line)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--accent-soft)}50%{box-shadow:0 0 0 7px var(--accent-soft)}}
@media (prefers-reduced-motion:reduce){.map .next .node{animation:none}.xpbar i{transition:none}}
/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(0)}65%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes chipIn{from{opacity:0;transform:translateX(-22px) scale(.85)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dasharray:1;stroke-dashoffset:1}to{stroke-dasharray:1;stroke-dashoffset:0}}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--accent)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes floatUp{0%{opacity:0;transform:translateY(8px) scale(.8)}20%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-34px) scale(1)}}
@keyframes bump{50%{transform:scale(1.2)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes lineIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes sweep{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
@keyframes bannerIn{0%{opacity:0;transform:scale(.5) rotate(-6deg)}60%{opacity:1;transform:scale(1.08) rotate(1deg)}100%{opacity:1;transform:none}}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
@keyframes spinIn{from{transform:rotate(-180deg) scale(0)}to{transform:none}}
#stage .hero,#stage>section{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
#stage>section:nth-of-type(1){animation-delay:.07s}#stage>section:nth-of-type(2){animation-delay:.14s}#stage>section:nth-of-type(3){animation-delay:.21s}#stage>section:nth-of-type(4){animation-delay:.28s}
.theory .txt>*{animation:rise .5s both}.theory .txt>*:nth-child(2){animation-delay:.12s}.theory .txt>*:nth-child(3){animation-delay:.2s}.theory .txt>*:nth-child(4){animation-delay:.28s}.theory .txt>*:nth-child(5){animation-delay:.36s}
.file.enter{animation:chipIn .5s cubic-bezier(.2,.8,.2,1) both}
.zone{transition:border-color .3s,background-color .3s}
.zone.hit{background:var(--accent-soft)}
.zone.box.hit{background:var(--gold-soft)}
.graph .pop{transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.2,.8,.2,1) both}
.graph .draw{animation:draw .55s ease-out both}
.graph .head-ring{transform-box:fill-box;transform-origin:center;animation:bump 1.8s ease-in-out infinite}
.mission li{transition:background-color .3s,border-color .3s,opacity .3s}
.mission li.just{animation:glow .9s ease-out}
.mission li.just .ck{animation:spinIn .5s cubic-bezier(.2,.8,.2,1)}
.hintcmds:not([hidden]) button{animation:chipIn .35s both}
.opt.wrong{animation:shake .42s}
.opt.right{animation:bump .4s}
.why{animation:rise .3s both}
.stars .s{display:inline-block;animation:pop .6s cubic-bezier(.2,.8,.2,1) both}
.stars .s:nth-child(2){animation-delay:.18s}.stars .s:nth-child(3){animation-delay:.36s}
.finish .big:not(:disabled){animation:bump 1.6s ease-in-out infinite .8s}
.xpbar{position:relative}
.xpbar i{position:relative;overflow:hidden}
.xpbar i::after{content:"";position:absolute;inset:0;width:35%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:sweep 2.8s ease-in-out infinite}
.lvl{position:relative}
.xpfloat{position:absolute;right:0;top:-2px;font:800 15px var(--f-display);color:var(--gold);pointer-events:none;animation:floatUp 1.1s ease-out forwards}
.bump{animation:bump .45s}
.out .nl{animation:lineIn .28s both}
.map li.justdone .node{animation:pop .6s cubic-bezier(.2,.8,.2,1)}
.art .flow{animation:flow 1.1s linear infinite}
.art .blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.art .bob{animation:bob 2.6s ease-in-out infinite}
.art .drawin{animation:draw 1.4s ease-out both .4s}
.art .pulse{transform-box:fill-box;transform-origin:center;animation:bump 1.8s ease-in-out infinite}
.art .pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.lvlup{position:fixed;inset:0;z-index:28;display:grid;place-items:center;pointer-events:none;animation:fadeOut .5s 2.4s forwards}
.lvlup div{background:var(--surface);border:3px solid var(--gold);border-radius:20px;padding:22px 34px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:bannerIn .6s cubic-bezier(.2,.8,.2,1) both}
.lvlup small{display:block;font:600 12px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.lvlup b{display:block;font:800 30px/1.2 var(--f-display);margin-top:6px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.lvlup{display:none}}

.reset{margin-top:18px;font-size:13px;color:var(--muted);background:none;border:1px dashed var(--line);border-radius:8px;padding:6px 10px}
.reset.arm{color:var(--bad);border-color:var(--bad)}

/* stage */
main{min-width:0}
.hero{display:flex;gap:20px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.hero .eyebrow{font:600 12px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.hero h1{font:800 clamp(26px,4vw,40px)/1.1 var(--f-display);margin:10px 0 8px;text-wrap:balance;letter-spacing:-.015em}
.hero p{margin:0;color:var(--muted);max-width:60ch;font-size:17px}
.reward{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:600 12px var(--f-mono);border-radius:999px;padding:5px 10px;background:var(--gold-soft);color:var(--gold);white-space:nowrap}

.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px}
.block>h2{font:700 19px/1.25 var(--f-display);margin:0 0 4px;display:flex;align-items:center;gap:10px}
.block>h2 .step{font:700 12px var(--f-mono);background:var(--surface2);color:var(--muted);border-radius:6px;padding:3px 7px}
.block>.sub{color:var(--muted);margin:0 0 16px;font-size:15px}
.theory{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:24px;align-items:start}
.theory .txt p{margin:0 0 12px;max-width:62ch}
.theory .txt ul{margin:0 0 12px;padding-left:20px}
.theory .txt li{margin:4px 0}
.art{background:var(--surface2);border-radius:12px;padding:14px}
.art svg{width:100%;height:auto;display:block}
.art figcaption{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}
.tip{background:var(--info-soft);border-radius:10px;padding:10px 14px;margin:6px 0 12px;font-size:15px}
.tip b{color:var(--info)}
.warn{background:var(--bad-soft);border-radius:10px;padding:10px 14px;margin:6px 0 12px;font-size:15px}
.warn b{color:var(--bad)}

/* practice */
.mission{display:grid;gap:8px;margin:0 0 16px;padding:0;list-style:none}
.mission li{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid transparent}
.mission li.now{border-color:var(--accent);background:var(--accent-soft)}
.mission li.ok{opacity:.75}
.mission .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;background:var(--surface)}
.mission li.ok .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.mission li.now .ck{border-color:var(--accent)}
.hintbtn{font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 9px;white-space:nowrap}
.hintcmds{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px}
.hintcmds button{font:13px var(--f-mono);background:var(--term-bg);color:var(--term-ok);border:0;border-radius:6px;padding:4px 9px}

.sim{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px}
.term{background:var(--term-bg);color:var(--term-fg);border-radius:12px;display:flex;flex-direction:column;min-height:340px;overflow:hidden;font:14px/1.5 var(--f-mono)}
.term-top{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid #26302b;color:var(--term-dim);font-size:12px}
.term-top i{width:10px;height:10px;border-radius:50%;background:#3a4540;display:inline-block}
.term-top span{margin-left:6px}
.term-top button{margin-left:auto;background:none;border:1px solid #33403a;color:var(--term-dim);border-radius:6px;font-size:12px;padding:2px 8px}
.out{flex:1;overflow-y:auto;padding:10px 12px;max-height:340px;white-space:pre-wrap;word-break:break-word}
.out .cmd{color:var(--term-fg)}
.out .cmd::before{content:"$ ";color:var(--term-ok)}
.out .ok{color:var(--term-ok)}.out .err{color:var(--term-err)}.out .warn{color:var(--term-warn)}.out .dim{color:var(--term-dim)}
.inrow{display:flex;gap:8px;align-items:center;border-top:1px solid #26302b;padding:8px 10px}
.inrow label{color:var(--term-ok)}
.inrow input{flex:1;min-width:0;background:transparent;border:0;color:var(--term-fg);font:inherit;outline:none;padding:6px 0}
.inrow button{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:6px 12px;font:600 13px var(--f-body)}
.visual{display:grid;gap:12px;min-width:0}
.zones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;position:relative}
.zone{border:2px dashed var(--line);border-radius:12px;padding:10px 8px;min-height:120px;background:var(--surface)}
.zone h3{font:700 12px/1.2 var(--f-body);margin:0 0 2px;display:flex;align-items:center;gap:6px}
.zone .zs{font-size:11px;color:var(--muted);margin:0 0 8px;line-height:1.3}
.zone.box{border-style:solid;border-color:var(--gold)}
.zone.hist{border-style:solid;border-color:var(--accent)}
.files{display:flex;flex-direction:column;gap:5px}
.file{font:12px/1.2 var(--f-mono);padding:5px 7px;border-radius:6px;background:var(--surface2);display:flex;gap:5px;align-items:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file.new{background:var(--accent-soft);color:var(--accent)}
.file.mod{background:var(--gold-soft);color:var(--gold)}
.file.conf{background:var(--bad-soft);color:var(--bad)}
.file small{margin-left:auto;font-size:10px;opacity:.8}
.empty{font-size:12px;color:var(--muted);font-style:italic}
.flow{display:flex;justify-content:space-around;font:11px var(--f-mono);color:var(--muted);margin-top:-4px}
.graphbox{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 10px 4px}
.graphbox h3{font:700 12px var(--f-body);margin:0 0 4px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.graphbox h3 span{font-weight:400;color:var(--muted)}
.graph{overflow-x:auto}
.graph svg{display:block}
.cloud{border:1px solid var(--line);border-radius:12px;background:var(--info-soft);padding:8px 12px;font-size:13px;display:flex;gap:8px;align-items:center}

/* quiz */
.q{border-top:1px solid var(--line);padding:16px 0}
.q:first-of-type{border-top:0;padding-top:4px}
.q h3{font:600 17px/1.35 var(--f-body);margin:0 0 10px;text-wrap:balance}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-size:15px;transition:border-color .15s}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.why{margin-top:10px;font-size:14px;padding:8px 12px;border-radius:8px}
.why.r{background:var(--accent-soft)}.why.w{background:var(--bad-soft)}

.finish{text-align:center;padding:28px 22px;border:2px solid var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--surface))}
.finish h2{justify-content:center;font-size:24px}
.stars{font-size:40px;letter-spacing:8px;color:var(--gold);margin:6px 0}
.stars .off{color:var(--line)}
.finish ul{list-style:none;padding:0;margin:8px 0 16px;color:var(--muted);font-size:14px}
.big{background:var(--accent);color:var(--accent-fg);border:0;border-radius:12px;padding:12px 22px;font:700 16px var(--f-display)}
.big:disabled{opacity:.45;cursor:not-allowed}
.locked{color:var(--muted);font-size:14px;text-align:center}

/* badges dialog & toasts */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);border-radius:16px;max-width:560px;width:100%;padding:22px;max-height:85vh;overflow:auto}
.dlg h2{font:700 20px var(--f-display);margin:0 0 14px;display:flex;justify-content:space-between}
.dlg h2 button{background:none;border:0;font-size:22px;line-height:1}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bdg{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.bdg .ic{width:48px;height:48px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);font:800 20px var(--f-display)}
.bdg.off{opacity:.45;filter:grayscale(1)}
.bdg b{display:block;font-size:14px}
.bdg span{font-size:12px;color:var(--muted)}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:grid;gap:8px;justify-items:end}
.toast{background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tin .3s ease-out}
.toast.gold{background:var(--gold);color:#1a1205}
@keyframes tin{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:25;width:100%;height:100%}

@media (max-width:1020px){.sim{grid-template-columns:1fr}.theory{grid-template-columns:1fr}.art{max-width:420px}}
@media (max-width:820px){
  .wrap{grid-template-columns:1fr;gap:16px;padding-block:16px 60px}
  .map{position:static}
  .map ol{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px}
  .map ol::before{left:18px;right:18px;top:22px;bottom:auto;width:auto;height:3px}

        else if(x[f]===o[f]){if(y[f]!==undefined)m[f]=y[f]}

}

const FILE="сценарий.txt";
const L=[
{id:"what",title:"Что такое Git",short:"Сохранялки для файлов",art:"saves",cap:"Каждый коммит — как точка сохранения в игре",
 theory:`<p>Знакомо? <code>сценарий_новый_ФИНАЛ_точно_последний.docx</code>. Git избавляет от этой каши.</p>
 <p><b>Git — это сохранялки для папки с файлами.</b> Как в игре: дошли до важного места — сохранились. Испортили — загрузились с любого сохранения.</p>
 <p>Файл остаётся <b>один</b>, а все прошлые версии Git прячет у себя внутри.</p>
 <div class="tip"><b>Git и GitHub — не одно и то же.</b> Git — программа у вас на компьютере, работает без интернета. GitHub — сайт, облачный диск для Git-проектов.</div>`,
 quiz:[{q:"Что такое коммит?",o:["Сохранение файлов с подписью, что поменялось","Удаление старых файлов","Отправка файла другу","Папка на рабочем столе"],a:0,w:"Коммит — точка сохранения. К нему всегда можно вернуться."},
  {q:"Git и GitHub — это…",o:["Одно и то же","Git — программа у вас, GitHub — сайт-хранилище","Git — сайт, GitHub — программа"],a:1,w:"Git живёт на компьютере. GitHub хранит копию проекта в облаке."},
  {q:"Можно ли пользоваться Git без интернета?",o:["Да, Git работает на компьютере","Нет, только онлайн"],a:0,w:"Интернет нужен, только чтобы отправить или забрать изменения с GitHub."}]},
{id:"init",title:"Репозиторий",short:"git init и git status",art:"folder",cap:"Скрытая папка .git хранит всю историю",
 theory:`<p><b>Репозиторий</b> (коротко «репо») — обычная папка, за которой присматривает Git.</p>
 <p>Чтобы Git начал присматривать, в папке один раз пишут <code>git init</code>. Внутри появится скрытая папка <code>.git</code> — там вся история. Её не трогаем.</p>
 <p>Самая полезная команда на свете — <code>git status</code>. Она отвечает на вопрос <b>«что сейчас происходит?»</b></p>
 <div class="tip"><b>Как пользоваться песочницей.</b> Ниже настоящий терминал-тренажёр. Пишите команды и жмите Enter. Застряли — жмите «Подсказка».</div>`,
 setup:r=>{r.files[FILE]="Сюжет начинается в Лос-Сантосе."},
 steps:[{t:"Включите Git в папке",h:["git init"],c:r=>r.inited},
  {t:"Спросите Git, что происходит",h:["git status"],c:r=>r.inited&&/^git status/.test(r.last)}],
 quiz:[{q:"Что делает git init?",o:["Включает Git в текущей папке","Скачивает Git из интернета","Удаляет историю"],a:0,w:"Команду пишут один раз на папку."},
  {q:"Какая команда отвечает «что происходит?»",o:["git log","git status","git init"],a:1,w:"Не понимаете, что творится, — пишите git status."},
  {q:"Что будет, если удалить папку .git?",o:["Ничего страшного","Пропадёт вся история сохранений","Git станет быстрее"],a:1,w:"В .git лежат все коммиты. Её не трогаем."}]},
{id:"commit",title:"Коммит",short:"git add и git commit",art:"zones",cap:"Файлы кладут в коробку, коробку заклеивают коммитом",
 theory:`<p>Сохранение делается <b>в два шага</b>, как отправка посылки:</p>
 <ul><li><code>git add файл</code> — <b>кладём в коробку</b>. Выбираем, что войдёт в сохранение.</li>
 <li><code>git commit -m "подпись"</code> — <b>заклеиваем и подписываем</b>. Сохранение готово.</li></ul>
 <p>Зачем коробка? Можно поменять пять файлов, а сохранить только два — те, что про одну задачу.</p>
 <p><code>git add .</code> — точка значит «все файлы сразу».</p>
 <div class="tip"><b>Хорошая подпись</b> понятна через полгода: «Добавил вступление», а не «правки».</div>`,
 setup:r=>{r.quick(["git init"]);r.files[FILE]="Сюжет начинается в Лос-Сантосе."},
 steps:[{t:"Положите "+FILE+" в коробку",h:["git add "+FILE],c:r=>FILE in r.index},
  {t:"Сделайте первый коммит с подписью",h:['git commit -m "Первая версия"'],c:r=>r.count()>=1},
  {t:"Создайте файл идеи.txt и тоже сохраните",h:["touch идеи.txt","git add .",'git commit -m "Добавил идеи"'],c:r=>r.count()>=2&&("идеи.txt" in r.H())}],
 quiz:[{q:"Зачем нужна «коробка» (git add)?",o:["Чтобы выбрать, что попадёт в сохранение","Чтобы удалить файл","Чтобы отправить на GitHub"],a:0,w:"В коммит уходит только то, что лежит в коробке."},
  {q:"Что значит точка в git add . ?",o:["Ничего","Все изменённые файлы в папке","Последний файл"],a:1,w:"Точка — «всё в этой папке»."},
  {q:"Какая подпись коммита лучше?",o:["правки","asdf","Добавил вступление к сценарию"],a:2,w:"Пишите, что сделали, чтобы потом найти нужное сохранение."}]},
{id:"log",title:"История",short:"git log и git diff",art:"history",cap:"Список сохранений: свежие сверху",
 theory:`<p>Git помнит каждое сохранение. Посмотреть список — <code>git log --oneline</code>.</p>
 <p>Слева в каждой строке — <b>хеш</b>, уникальный номер коммита, например <code>a1f3c9e</code>. По нему к коммиту можно вернуться.</p>
 <p>Что именно вы поменяли и ещё не сохранили — <code>git diff</code>. Строки с <code>-</code> убраны, с <code>+</code> добавлены.</p>
 <div class="tip"><b>В настоящем терминале</b> длинный список закрывается клавишей <kbd>q</kbd>.</div>`,
 setup:r=>{r.files[FILE]="Сюжет начинается в Лос-Сантосе.";r.quick(["git init","git add .",'git commit -m "Первая версия"'])},
 steps:[{t:"Поменяйте "+FILE,h:["edit "+FILE],c:r=>r.files[FILE]!==r.index[FILE]||r.count()>=2},
  {t:"Посмотрите, что поменялось",h:["git diff"],c:r=>/^git diff/.test(r.last)||r.count()>=2},
  {t:"Сохраните правку новым коммитом",h:["git add .",'git commit -m "Переписал начало"'],c:r=>r.count()>=2},
  {t:"Посмотрите историю",h:["git log --oneline"],c:r=>r.count()>=2&&/^git log/.test(r.last)}],
 quiz:[{q:"Что за набор символов слева в git log --oneline?",o:["Пароль","Хеш — номер коммита","Дата"],a:1,w:"Хеш нужен, чтобы сослаться на конкретный коммит."},
  {q:"Какой коммит в git log наверху?",o:["Самый старый","Самый свежий"],a:1,w:"Свежие сверху, старые снизу."},
  {q:"Что показывает git diff?",o:["Что поменялось, но ещё не сохранено","Список веток","Адрес GitHub"],a:0,w:"Минусы — убрано, плюсы — добавлено."}]},
{id:"undo",title:"Отмена",short:"restore и revert",art:"undo",cap:"Три кнопки «назад» на разные случаи",
 theory:`<p>Самый успокаивающий урок. Пока работа закоммичена, её почти невозможно потерять.</p>
 <ul><li><b>Испортил файл, ещё не сохранял</b> → <code>git restore файл</code>. Файл станет как в последнем коммите.</li>
 <li><b>Положил в коробку лишнее</b> → <code>git restore --staged файл</code>. Вынет из коробки, правки останутся.</li>
 <li><b>Коммит был ошибкой</b> → <code>git revert хеш</code>. Git сделает новый коммит «наоборот».</li></ul>
 <div class="warn"><b>Осторожно с git reset --hard.</b> Он навсегда стирает несохранённую работу. Новичку почти никогда не нужен.</div>`,
 setup:r=>{r.files[FILE]="Сюжет начинается в Лос-Сантосе.";r.quick(["git init","git add .",'git commit -m "Первая версия"']);r.files[FILE]="Кот прошёлся по клавиатуре: ыввапролдж";r.files["черновик.txt"]="Пока не готово"},
 steps:[{t:"Кот испортил "+FILE+". Верните сохранённую версию",h:["git restore "+FILE],c:r=>r.files[FILE]===r.H()[FILE]},
  {t:"Положите черновик.txt в коробку",h:["git add черновик.txt"],c:r=>"черновик.txt" in r.index||r.events.includes("unstage")},
  {t:"Передумали! Выньте черновик.txt из коробки",h:["git restore --staged черновик.txt"],c:r=>!("черновик.txt" in r.index)&&("черновик.txt" in r.files)}],
 quiz:[{q:"Какой способ отменить коммит безопасен даже после отправки на GitHub?",o:["git revert","git reset --hard","Удалить папку .git"],a:0,w:"revert не переписывает историю, а добавляет коммит-отмену."},
  {q:"git restore файл — что будет с несохранёнными правками в нём?",o:["Пропадут","Уйдут в коробку","Отправятся на GitHub"],a:0,w:"Поэтому restore делают, когда правки точно не нужны."},
  {q:"Какую команду новичку лучше обходить?",o:["git status","git reset --hard","git log"],a:1,w:"Она стирает работу без возврата."}]},
{id:"branch",title:"Ветки",short:"Черновик рядом с чистовиком",art:"branch",cap:"Ветка — отдельная линия истории",
 theory:`<p><b>Ветка</b> — как копия проекта «на черновик». В ней пробуете что угодно, а основная версия остаётся целой.</p>
 <p>Главная ветка обычно называется <code>main</code>.</p>
 <ul><li><code>git switch -c имя</code> — создать ветку и перейти в неё</li>
 <li><code>git switch имя</code> — перейти в другую ветку</li>
 <li><code>git branch</code> — список веток, текущая со звёздочкой</li></ul>
 <div class="tip"><b>Смотрите на граф справа</b>: новая ветка рисуется отдельной линией своего цвета.</div>`,

const BADGES=[
 {id:"first",n:"Первое сохранение",d:"Сделать первый коммит",i:"1"},

const LEVELS=[[0,"Чайник"],[100,"Ученик"],[250,"Сохраняльщик"],[450,"Ветковод"],[600,"Мастер слияний"],[780,"Гит-гуру"]];

/* ---------- gamification ---------- */
function addXP(n,why){store.xp+=n;save();renderBar();toast("+"+n+" XP · "+why);const f=document.createElement("span");f.className="xpfloat";f.textContent="+"+n;$(".lvl").appendChild(f);setTimeout(()=>f.remove(),1200);bumpEl($("#lvlNum"))}

function badge(id){if(store.badges.includes(id))return;store.badges.push(id);save();const b=BADGES.find(x=>x.id===id);toast("Новый значок: "+b.n,"gold");renderBar();burst(40);bumpEl($("#badgesBtn"))}
function levelOf(xp){let i=0;for(let k=0;k<LEVELS.length;k++)if(xp>=LEVELS[k][0])i=k;return i}
function renderBar(){
  const i=levelOf(store.xp),lo=LEVELS[i][0],hi=LEVELS[i+1]?LEVELS[i+1][0]:lo;
  $("#lvlNum").textContent="Ур. "+(i+1);$("#lvlName").textContent=LEVELS[i][1];
  $("#xpFill").style.width=(hi>lo?Math.min(100,(store.xp-lo)/(hi-lo)*100):100)+"%";
  $("#xpText").textContent=store.xp+(LEVELS[i+1]?" / "+hi:"")+" XP";
  $("#bCount").textContent=store.badges.length+"/"+BADGES.length;
}
let lastLvl=levelOf(store.xp);
function checkLevelUp(){const l=levelOf(store.xp);if(l>lastLvl){lastLvl=l;burst(90);if(!reduce){const o=document.createElement("div");o.className="lvlup";o.innerHTML=`<div><small>Новый уровень ${l+1}</small><b>${esc(LEVELS[l][1])}</b></div>`;document.body.appendChild(o);setTimeout(()=>o.remove(),3000)}else toast("Новый уровень: "+LEVELS[l][1]+"!","gold")}}
function toast(t,cls){const d=document.createElement("div");d.className="toast "+(cls||"");d.textContent=t;const T=$("#toasts");T.appendChild(d);while(T.children.length>3)T.firstChild.remove();setTimeout(()=>d.remove(),2800);checkLevelUp()}

/* confetti */
const cv=$("#fx"),cx=cv.getContext("2d");let parts=[],raf=0;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function burst(n){if(reduce)return;cv.width=innerWidth;cv.height=innerHeight;const cs=getComputedStyle(document.documentElement);const cols=["--lane0","--lane1","--lane2","--lane3"].map(v=>cs.getPropertyValue(v).trim());
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*12,vy:-Math.random()*10-3,s:4+Math.random()*5,c:cols[i%4],life:90+Math.random()*40,r:Math.random()*6});
  if(!raf)raf=requestAnimationFrame(tick)}
function tick(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.life-->0);for(const p of parts){p.vy+=.3;p.x+=p.vx;p.y+=p.vy;p.r+=.1;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.6);cx.restore()}raf=parts.length?requestAnimationFrame(tick):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}

/* ---------- map ---------- */
function renderMap(just){
  const firstOpen=L.findIndex(l=>!ls(l.id).done);
  $("#map").innerHTML=L.map((l,i)=>{const s=ls(l.id);const cls=[s.done?"done":"",i===firstOpen?"next":"",i===cur?"cur":"",i===just?"justdone":""].join(" ");
    const st=[0,1,2].map(k=>k<s.stars?"★":'<span class="off">★</span>').join("");
    return `<li class="${cls}"><button type="button" data-i="${i}" aria-current="${i===cur?"step":"false"}"><span class="node">${s.done?"✓":i+1}</span><span><span class="mt">${esc(l.title)}</span><span class="ms" aria-label="звёзд: ${s.stars}">${s.done?st:""}</span></span></button></li>`}).join("");
}
$("#map").addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(b)openLesson(+b.dataset.i,true)});

  <section class="block"><h2><span class="step">1</span>Разбираемся</h2><p class="sub">Читаем минуту — и сразу в бой.</p>
   <div class="theory"><div class="txt">${l.theory}</div><figure class="art" style="margin:0">${ART[l.art]}<figcaption>${esc(l.cap)}</figcaption></figure></div></section>
  ${hasPractice?`<section class="block"><h2><span class="step">2</span>${l.free?"Песочница":"Практика"}</h2><p class="sub">${l.free?"Свободный режим: любые команды. Наберите help.":"Выполните задания в терминале. Справа видно, что происходит внутри Git."}</p>
   ${l.steps.length?'<ol class="mission" id="mission"></ol>':""}

     <div class="out" id="out" aria-live="polite"></div>
     <form class="inrow" id="termForm" autocomplete="off"><label for="cmd">$</label><input id="cmd" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="напишите команду…"><button type="submit">Ввод</button></form></div>
    <div class="visual" id="visual"></div></div></section>`:""}
  <section class="block" id="quiz"><h2><span class="step">${hasPractice?3:2}</span>${l.free?"Экзамен":"Проверь себя"}</h2><p class="sub">Первый правильный ответ — +10 XP. Ошиблись — читайте пояснение и пробуйте снова.</p><div id="qs"></div></section>
  <section class="block finish" id="finish"></section>`;
  renderMap();renderQuiz();
  if(hasPractice){
    print([{t:l.free?"Песочница готова. Наберите help, чтобы увидеть команды.":"Терминал готов. Первое задание — сверху. Застряли — жмите «Подсказка».",c:"dim"}]);
    $("#termForm").addEventListener("submit",e=>{e.preventDefault();exec($("#cmd").value)});
    $("#cmd").addEventListener("keydown",e=>{if(e.key==="ArrowUp"){if(histPos>0){histPos--;$("#cmd").value=histCmd[histPos]||""}e.preventDefault()}else if(e.key==="ArrowDown"){if(histPos<histCmd.length){histPos++;$("#cmd").value=histCmd[histPos]||""}e.preventDefault()}});
    $("#resetSim").addEventListener("click",()=>{repo=new Repo();l.setup(repo);seen=new Set();seenLab=new Set();prevZ=null;stepIdx=0;outLines=[];print([{t:"Начали задание заново.",c:"dim"}]);renderMission();renderVisual()});
    renderMission();renderVisual();
  }

  if(scroll)window.scrollTo({top:0,behavior:reduce?"auto":"smooth"});
}
function print(lines){const o=$("#out");if(!o)return;outLines.forEach(x=>x.n=false);for(const x of lines){if(x.c==="clear"){outLines=[];continue}x.n=true;outLines.push(x)}o.innerHTML=outLines.slice(-200).map((x,i)=>`<div class="${x.c}${x.n?" nl":""}">${esc(x.t)}</div>`).join("");o.scrollTop=o.scrollHeight}
function exec(line){
  line=line.trim();if(!line)return;$("#cmd").value="";histCmd.push(line);histPos=histCmd.length;
  repo.events=[];const res=repo.run(line);print([{t:line,c:"cmd"}].concat(res));
  for(const e of repo.events){if(e==="commit")badge("first");if(e==="branch")badge("brancher");if(e==="merge-resolved")badge("peace");if(e==="push")badge("cloud");if(e==="restore"&&L[cur].id==="undo")badge("undo")}
  advance();renderVisual();
}
function advance(){
  const l=L[cur],s=ls(l.id);let moved=false;const from=stepIdx;
  while(stepIdx<l.steps.length&&l.steps[stepIdx].c(repo)){
    if(!s.awarded.includes(stepIdx)){s.awarded.push(stepIdx);save();addXP(10,"задание выполнено")}
    stepIdx++;moved=true}
  if(moved){renderMission(from);if(stepIdx===l.steps.length){print([{t:"Все задания выполнены! Теперь вопросы ниже.",c:"ok"}]);if(!hintsUsed)badge("solo");burst(50);renderFinish()}}
}
function renderMission(from){
  const m=$("#mission");if(!m)return;const l=L[cur];
  m.innerHTML=l.steps.map((st,i)=>{const cls=(i<stepIdx?"ok":i===stepIdx?"now":"")+(from!==undefined&&i>=from&&i<stepIdx?" just":"");
    return `<li class="${cls}"><span class="ck">${i<stepIdx?"✓":i+1}</span><span>${esc(st.t)}</span>${i===stepIdx?`<button type="button" class="hintbtn" data-h="${i}">Подсказка</button>`:"<span></span>"}<div class="hintcmds" id="h${i}" hidden></div></li>`}).join("");
  m.querySelectorAll(".hintbtn").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.h,box=$("#h"+i);hintsUsed=true;
    box.innerHTML=L[cur].steps[i].h.map(c=>`<button type="button" title="Вставить в терминал">${esc(c)}</button>`).join("");box.hidden=false;b.remove();
    box.querySelectorAll("button").forEach(x=>x.addEventListener("click",()=>{$("#cmd").value=x.textContent;$("#cmd").focus()}))}));
}
function renderVisual(){
  const v=$("#visual");if(!v)return;const r=repo,H=r.H(),I=r.index,W=r.files;
  const nowZ=new Set(),hit={w:false,b:false,h:false};
  const chip=(z,f,c,t)=>{const k=z+"|"+f+"|"+c+"|"+(z==="h"?H[f]:z==="b"?I[f]:W[f]);nowZ.add(k);const en=prevZ&&!prevZ.has(k);if(en)hit[z]=true;return `<div class="file ${c}${en?" enter":""}" title="${esc(f)}">${esc(f)}${t?`<small>${t}</small>`:""}</div>`};
  const wf=Object.keys(W).map(f=>{let c="",t="";if(r.conflicts.includes(f)){c="conf";t="конфликт"}else if(!(f in I)){c="new";t="новый"}else if(W[f]!==I[f]){c="mod";t="изменён"}return chip("w",f,c,t)}).join("")||'<div class="empty">пусто</div>';
  const staged=[...new Set([...Object.keys(I),...Object.keys(H)])].filter(f=>I[f]!==H[f]);
  const bf=staged.map(f=>chip("b",f,f in H?"mod":"new","")).join("")||'<div class="empty">коробка пуста</div>';
  const hf=r.inited?(Object.keys(H).map(f=>chip("h",f,"","")).join("")||'<div class="empty">ещё нет коммитов</div>'):'<div class="empty">Git выключен — нужен git init</div>';
  v.innerHTML=`<div class="zones">
    <div class="zone${hit.w?" hit":""}"><h3>Папка</h3><p class="zs">файлы, как они есть</p><div class="files">${wf}</div></div>
    <div class="zone box${hit.b?" hit":""}"><h3>Коробка</h3><p class="zs">уйдёт в коммит</p><div class="files">${bf}</div></div>
    <div class="zone hist${hit.h?" hit":""}"><h3>Сохранено</h3><p class="zs">последний коммит</p><div class="files">${hf}</div></div></div>
   <div class="flow"><span>git add →</span><span>git commit →</span></div>
   <div class="graphbox"><h3>Граф коммитов <span>ветка: <b>${esc(r.head)}</b>${r.merging?" · идёт слияние":""}</span></h3><div class="graph">${graph(r)}</div></div>
   ${r.remote?`<div class="cloud"><b>GitHub:</b> ${r.remoteBranches.main?(r.isAnc(r.remoteBranches.main,r.tip("main"))?(r.remoteBranches.main===r.tip("main")?"всё отправлено":"у вас есть неотправленные коммиты"):"в облаке есть новое — нужен git pull"):"пока пусто"}</div>`:""}`;
  prevZ=nowZ;setTimeout(()=>v.querySelectorAll(".zone.hit").forEach(z=>z.classList.remove("hit")),600);
}
function graph(r){
  if(!r.inited)return '<p class="empty" style="margin:8px 0 12px">Репозитория нет. Наберите git init</p>';
  const tips=[...Object.values(r.branches),...Object.values(r.remoteBranches)];
  const vis=new Set();tips.forEach(t=>r.anc(t).forEach(x=>vis.add(x)));
  const local=new Set();Object.values(r.branches).forEach(t=>r.anc(t).forEach(x=>local.add(x)));
  const cs=[...vis].map(i=>r.commits[i]).sort((a,b)=>a.seq-b.seq);
  if(!cs.length)return '<p class="empty" style="margin:8px 0 12px">Сохранений пока нет. Сделайте первый коммит!</p>';
  const pos={};const maxLane=Math.max(0,...cs.map(c=>c.lane));const X=i=>36+i*62,Y=l=>56+l*54;
  cs.forEach((c,i)=>pos[c.id]={x:X(i),y:Y(c.lane)});
  const fresh={};let fk=0;const firstPaint=seen.size===0;cs.forEach(c=>{if(!seen.has(c.id)){fresh[c.id]=(fk++)*(firstPaint?.07:.12)}});
  const W=X(cs.length-1)+80,Hh=Y(maxLane)+44;
  let s=`<svg width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Граф коммитов">`;
  for(const c of cs)for(const p of c.parents){if(!pos[p])continue;const a=pos[p],b=pos[c.id];const col=`var(--lane${(a.y===b.y?c.lane:Math.max(c.lane,r.commits[p].lane))%4})`;
    const an=c.id in fresh?` class="draw" pathLength="1" style="animation-delay:${fresh[c.id]}s"`:"";
    s+=a.y===b.y?`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${col}" stroke-width="3"${an}/>`:`<path d="M${a.x} ${a.y} C ${a.x+40} ${a.y}, ${b.x-40} ${b.y}, ${b.x} ${b.y}" stroke="${col}" stroke-width="3" fill="none"${an}/>`}
  const labels={},nextLab=new Set();
  for(const b in r.branches)(labels[r.branches[b]]=labels[r.branches[b]]||[]).push({t:b,head:b===r.head});
  for(const b in r.remoteBranches)(labels[r.remoteBranches[b]]=labels[r.remoteBranches[b]]||[]).push({t:"origin/"+b,remote:true});
  for(const c of cs){const p=pos[c.id],col=`var(--lane${c.lane%4})`,isLocal=local.has(c.id);
    const isHead=c.id===r.tip();if(isHead)s+=`<circle class="head-ring" cx="${p.x}" cy="${p.y}" r="15" fill="none" stroke="${col}" stroke-width="2" opacity=".45"/>`;
    s+=`<g${c.id in fresh?` class="pop" style="animation-delay:${fresh[c.id]+.25}s"`:""}><title>${esc(c.id+" — "+c.msg+" ("+c.author+")")}</title><circle cx="${p.x}" cy="${p.y}" r="10" fill="${isLocal?col:"var(--surface)"}" stroke="${col}" stroke-width="3" ${isLocal?"":'stroke-dasharray="3 3"'}/>${c.parents.length>1?`<circle cx="${p.x}" cy="${p.y}" r="4" fill="var(--surface)"/>`:""}
    <text x="${p.x}" y="${p.y+26}" text-anchor="middle" font-size="10" font-family="var(--f-body)" fill="var(--muted)">${esc(c.msg.length>11?c.msg.slice(0,10)+"…":c.msg)}</text></g>`;
    (labels[c.id]||[]).forEach((lb,k)=>{const ty=p.y-20-k*18,w=lb.t.length*6.6+(lb.head?14:10);const lk=c.id+"|"+lb.t+"|"+!!lb.head;const ln=!seenLab.has(lk);nextLab.add(lk);
      s+=`<g${ln?` class="pop" style="animation-delay:${(fresh[c.id]||0)+.35}s"`:""}><rect x="${p.x-w/2}" y="${ty-12}" width="${w}" height="16" rx="8" fill="${lb.remote?"var(--info-soft)":lb.head?col:"var(--surface2)"}" stroke="${lb.remote?"var(--info)":col}" stroke-width="1"/><text x="${p.x}" y="${ty}" text-anchor="middle" font-size="10.5" font-family="var(--f-mono)" font-weight="600" fill="${lb.remote?"var(--info)":lb.head?"var(--accent-fg)":"var(--fg)"}">${esc((lb.head?"▸":"")+lb.t)}</text></g>`})}
  cs.forEach(c=>seen.add(c.id));seenLab=nextLab;
  return s+"</svg>";
}

function renderQuiz(){
  const l=L[cur],s=ls(l.id);
  $("#qs").innerHTML=l.quiz.map((q,qi)=>{const st=s.quiz[qi];const done=st&&st.ok;
    return `<div class="q" data-q="${qi}"><h3>${qi+1}. ${esc(q.q)}</h3><div class="opts">${q.o.map((o,oi)=>`<button type="button" class="opt ${done&&oi===q.a?"right":""}" data-o="${oi}" ${done?"disabled":""}>${esc(o)}</button>`).join("")}</div>${done?`<div class="why r">Верно! ${esc(q.w)}</div>`:""}</div>`}).join("");
  $("#qs").querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    const qd=b.closest(".q"),qi=+qd.dataset.q,oi=+b.dataset.o,q=l.quiz[qi];const st=s.quiz[qi]||(s.quiz[qi]={first:null,ok:false});
    const right=oi===q.a;if(st.first===null)st.first=right;
    qd.querySelectorAll(".why").forEach(x=>x.remove());
    const w=document.createElement("div");w.className="why "+(right?"r":"w");w.textContent=(right?"Верно! ":"Не совсем. ")+q.w;qd.appendChild(w);
    if(right){st.ok=true;b.classList.add("right");qd.querySelectorAll(".opt").forEach(x=>x.disabled=true);if(st.first)addXP(10,"верный ответ");else toast("Засчитано со второй попытки")}
    else b.classList.add("wrong");
    save();
    if(l.quiz.every((_,k)=>s.quiz[k]&&s.quiz[k].ok)){if(l.quiz.every((_,k)=>s.quiz[k].first))badge("smart");renderFinish()}
  }));
}
function renderFinish(){
  const l=L[cur],s=ls(l.id),f=$("#finish");
  const practiceOk=!l.steps||!l.steps.length||stepIdx>=l.steps.length||s.done;
  const quizOk=l.quiz.every((_,k)=>s.quiz[k]&&s.quiz[k].ok);
  const perfect=l.quiz.every((_,k)=>s.quiz[k]&&s.quiz[k].first);
  const noHints=!hintsUsed;
  const stars=1+(perfect?1:0)+(noHints?1:0);
  if(!(practiceOk&&quizOk)&&!s.done){
    f.innerHTML=`<h2>Финиш уровня</h2><p class="locked">${!practiceOk?"Осталось: выполнить практику. ":""}${!quizOk?"Осталось: ответить на все вопросы.":""}</p><button class="big" type="button" disabled>Завершить уровень</button>`;return}
  const show=s.done?Math.max(s.stars,0):stars;
  const isLast=cur===L.length-1;
  f.innerHTML=`<h2>${s.done?"Уровень пройден":"Уровень готов к сдаче!"}</h2><div class="stars" aria-label="звёзд: ${show}">${[0,1,2].map(k=>k<show?'<span class="s">★</span>':'<span class="s off">★</span>').join("")}</div>
   <ul><li>★ — уровень пройден</li><li>${perfect?"★":"☆"} — все ответы с первого раза</li><li>${noHints||s.done?"★":"☆"} — практика без подсказок</li></ul>
   <button class="big" type="button" id="finBtn">${s.done?(isLast?"Ещё раз с начала":"Следующий уровень →"):"Завершить уровень +50 XP"}</button>`;
  $("#finBtn").addEventListener("click",()=>{
    if(!s.done){s.done=true;s.stars=stars;save();addXP(50,"уровень пройден");burst(120);if(L.every(x=>ls(x.id).done))badge("guru");renderMap(cur);renderFinish();return}
    openLesson(isLast?0:cur+1,true)});
}

/* ---------- badges dialog & reset ---------- */
$("#badgesBtn").addEventListener("click",()=>{
  const o=document.createElement("div");o.className="overlay";
  o.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-label="Значки"><h2>Значки <button type="button" aria-label="Закрыть">×</button></h2><div class="bgrid">${BADGES.map(b=>`<div class="bdg ${store.badges.includes(b.id)?"":"off"}"><div class="ic">${esc(b.i)}</div><b>${esc(b.n)}</b><span>${esc(b.d)}</span></div>`).join("")}</div></div>`;
  document.body.appendChild(o);const close=()=>o.remove();o.addEventListener("click",e=>{if(e.target===o||e.target.closest("h2 button"))close()});
  document.addEventListener("keydown",function k(e){if(e.key==="Escape"){close();document.removeEventListener("keydown",k)}});o.querySelector("h2 button").focus()});
let armT=0;$("#reset").addEventListener("click",e=>{const b=e.currentTarget;
  if(!b.classList.contains("arm")){b.classList.add("arm");b.textContent="Точно стереть прогресс?";clearTimeout(armT);armT=setTimeout(()=>{b.classList.remove("arm");b.textContent="Начать заново"},3000);return}
  store={xp:0,lessons:{},badges:[],cur:0};lastLvl=0;save();b.classList.remove("arm");b.textContent="Начать заново";renderBar();openLesson(0,true)});

renderBar();openLesson(cur,false);
})();
