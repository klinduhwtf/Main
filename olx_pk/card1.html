<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1600px;height:1200px;font-family:Inter,sans-serif;background:#fff;overflow:hidden;position:relative}
.top{background:#e10600;height:330px;color:#fff;display:flex;align-items:center;padding:0 80px;gap:50px;position:relative;overflow:hidden}
.top:after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;background:repeating-linear-gradient(90deg,#fff 0 60px,#e10600 60px 120px)}
.cross{width:210px;height:210px;background:#fff;border-radius:40px;position:relative;flex:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.cross:before,.cross:after{content:"";position:absolute;background:#e10600;border-radius:10px}
.cross:before{left:80px;top:30px;width:50px;height:150px}.cross:after{left:30px;top:80px;width:150px;height:50px}
h1{font-size:112px;font-weight:900;line-height:.95;letter-spacing:-2px}
h1 small{display:block;font-size:44px;font-weight:600;letter-spacing:4px;opacity:.95;margin-top:14px}
.pulse{position:absolute;right:50px;bottom:40px;width:260px;opacity:.35}
.list{display:grid;grid-template-columns:1fr 1fr;gap:40px 60px;padding:80px 80px 0}
.it{display:flex;align-items:center;gap:22px;font-size:48px;font-weight:700;color:#1a1a1a}
.it b{flex:none;width:52px;height:52px;border-radius:50%;background:#e10600;color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center}
.bot{position:absolute;bottom:0;left:0;right:0;height:170px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;gap:50px;font-size:50px;font-weight:800}
.bot span{color:#ff3b30}
</style></head><body>
<div class="top"><div class="cross"></div><div><h1>СКОРАЯ ПОМОЩЬ<br>ДЛЯ ПК<small>РЕМОНТ · ОБСЛУЖИВАНИЕ · СОФТ</small></h1></div>
<svg class="pulse" viewBox="0 0 330 120"><polyline fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round" points="0,60 90,60 115,15 145,110 170,40 190,60 330,60"/></svg></div>
<div class="list">
<div class="it"><b>✓</b>Диагностика</div><div class="it"><b>✓</b>Удаление вирусов</div>
<div class="it"><b>✓</b>Установка Windows</div><div class="it"><b>✓</b>Чистка + термопаста</div>
<div class="it"><b>✓</b>Программы и драйверы</div><div class="it"><b>✓</b>Ускорение работы</div>
<div class="it"><b>✓</b>Замена SSD и ОЗУ</div><div class="it"><b>✓</b>Сборка и апгрейд</div>
<div class="it"><b>✓</b>Восстановление данных</div><div class="it"><b>✓</b>Wi‑Fi, принтеры</div>
</div>
<div class="bot">ВЫЕЗД НА ДОМ <span>●</span> БЫСТРО <span>●</span> ГАРАНТИЯ</div>
</body></html>
