<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1600px;height:1200px;font-family:Inter,sans-serif;background:#ffd400;color:#111;overflow:hidden;position:relative;display:flex}
.left{width:640px;background:#111;color:#ffd400;padding:80px 60px;display:flex;flex-direction:column;justify-content:space-between}
.big{font-size:106px;font-weight:900;line-height:1.18;letter-spacing:-3px}
.big span{color:#fff}
.sub{font-size:40px;font-weight:600;color:#fff;line-height:1.3}
.pc{width:300px}
.right{flex:1;padding:80px 70px}
.h{font-size:44px;font-weight:900;letter-spacing:2px;margin-bottom:34px;border-bottom:6px solid #111;padding-bottom:16px}
.it{font-size:46px;font-weight:700;padding:15px 0;display:flex;gap:20px;align-items:center;border-bottom:2px dashed rgba(0,0,0,.35)}
.it:before{content:"";width:22px;height:22px;background:#111;flex:none;transform:rotate(45deg)}
.stamp{position:absolute;right:60px;bottom:50px;background:#e10600;color:#fff;font-size:42px;font-weight:900;padding:18px 34px;border-radius:14px;transform:rotate(-4deg);box-shadow:6px 6px 0 #111}
</style></head><body>
<div class="left">
<div class="big">ПОЧИНЮ<br><span>ТВОЙ</span><br>КОМП</div>
<svg class="pc" viewBox="0 0 300 220"><rect x="10" y="10" width="280" height="160" rx="14" fill="none" stroke="#ffd400" stroke-width="12"/><path d="M110 210h80M150 170v40" stroke="#ffd400" stroke-width="12" stroke-linecap="round"/><path d="M95 95l35 35 75-70" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div class="sub">ПК и ноутбуки.<br>Сегодня — на дому.</div>
</div>
<div class="right">
<div class="h">ЧТО ДЕЛАЮ:</div>
<div class="it">Ремонт и диагностика</div>
<div class="it">Переустановка Windows</div>
<div class="it">Установка программ</div>
<div class="it">Чистка и замена термопасты</div>
<div class="it">Лечение от вирусов</div>
<div class="it">Ускорение старых ПК</div>
<div class="it">Апгрейд и сборка</div>
<div class="it">Настройка интернета</div>
</div>
<div class="stamp">ЧЕСТНЫЕ ЦЕНЫ</div>
</body></html>
