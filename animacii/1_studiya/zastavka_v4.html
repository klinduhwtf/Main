<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>1 СТУДИЯ — заставка, вариант 4</title>
<style>
  /* Палитра ERTIS: бирюзовый и жёлтый — на глубоком тёмном фоне */
  :root {
    --cyan: #00b2ca;
    --cyan-hi: #7fe6f2;
    --yellow: #fddb27;
    --deep: #020d13;
    --deep2: #06303d;
  }
  html, body { margin: 0; background: #000; }
  #stage {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background: radial-gradient(ellipse 85% 70% at 50% 40%, var(--deep2) 0%, var(--deep) 78%);
  }
  #floor { position: absolute; left: 0; top: 0; }
  #world {
    position: absolute; inset: 0; perspective: 1300px; perspective-origin: 50% 46%;
  }
  #cam { position: absolute; left: 960px; top: 500px; transform-style: preserve-3d; }
  .panel {
    position: absolute; transform-style: preserve-3d; box-sizing: border-box;
    border: 1.5px solid rgba(127,230,242,.45);
    background: linear-gradient(135deg, rgba(0,178,202,.16), rgba(0,178,202,.03) 60%, rgba(255,255,255,.06));
    box-shadow: inset 0 0 40px rgba(0,178,202,.08);
  }
  #beam {
    position: absolute; left: 960px; top: -300px; width: 900px; height: 1500px; margin-left: -450px;
    background: radial-gradient(ellipse 30% 60% at 50% 0%, rgba(160,240,255,.22), rgba(160,240,255,0) 70%);
    filter: blur(20px);
  }
  #logo { position: absolute; left: 0; top: 0; }
  #flare { position: absolute; left: 0; top: 0; mix-blend-mode: screen; }
  #grain { position: absolute; left: 0; top: 0; opacity: .04; mix-blend-mode: screen; }
  #vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(0,0,0,.7) 100%);
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="floor" width="1920" height="1080"></canvas>
  <div id="beam"></div>
  <div id="world"><div id="cam"></div></div>
  <canvas id="logo" width="1920" height="1080"></canvas>
  <canvas id="flare" width="1920" height="1080"></canvas>
  <canvas id="grain" width="960" height="540" style="width:1920px;height:1080px"></canvas>
  <div id="vignette"></div>
</div>

<script>
// ---------- Тайминги (совпадают со звуком zvuk_v4.py) ----------
const REVEAL = 3.2;   // появляется «1»
const WORD0 = 4.4;    // появляется «СТУДИЯ»
const SHINE = 5.8;    // блик по логотипу
const END = 9.0;

const WORD = "СТУДИЯ";
const ONE_SIZE = 440, WORD_SIZE = 92, TRACK_FINAL = 0.42;
const ONE_CY = 440, WORD_Y = 742;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, t0, t1) => clamp((t - t0) / (t1 - t0));
const lerp = (a, b, k) => a + (b - a) * k;
const eio2 = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const eio3 = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eo3 = k => 1 - Math.pow(1 - k, 3);
const eo4 = k => 1 - Math.pow(1 - k, 4);
const $ = id => document.getElementById(id);

// ---------- Стеклянные панели в 3D (детерминированно) ----------
let seed = 20261104;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const panels = [];
for (let i = 0; i < 30; i++) {
  const side = i % 2 ? 1 : -1;
  const p = {
    x: side * lerp(180, 1500, rnd()), y: lerp(-520, 640, rnd()), z: lerp(-3800, 300, rnd()),
    w: lerp(120, 520, rnd()), h: lerp(90, 620, rnd()), ry: side * lerp(8, 35, rnd()),
    drift: lerp(-30, 30, rnd()),
  };
  const el = document.createElement("div"); el.className = "panel";
  el.style.width = p.w + "px"; el.style.height = p.h + "px";
  el.style.marginLeft = -p.w / 2 + "px"; el.style.marginTop = -p.h / 2 + "px";
  $("cam").appendChild(el); p.el = el; panels.push(p);
}

// ---------- Пол: перспективная сетка ----------
const fctx = $("floor").getContext("2d");
function floor(t, a) {
  fctx.clearRect(0, 0, 1920, 1080);
  const hz = 610, vx = 960;
  fctx.lineWidth = 1;
  for (let i = -24; i <= 24; i++) {
    const xb = vx + i * 140;
    const g = fctx.createLinearGradient(0, hz, 0, 1080);
    g.addColorStop(0, "rgba(0,178,202,0)"); g.addColorStop(1, `rgba(0,178,202,${0.22 * a})`);
    fctx.strokeStyle = g;
    fctx.beginPath(); fctx.moveTo(vx + i * 6, hz); fctx.lineTo(xb + (xb - vx) * 1.6, 1080); fctx.stroke();
  }
  const off = (t * 0.22) % 1;   // медленное движение «вперёд»
  for (let j = 0; j < 14; j++) {
    const k = (j + off) / 14;
    const y = hz + Math.pow(k, 2.4) * (1080 - hz);
    fctx.strokeStyle = `rgba(0,178,202,${0.16 * a * k})`;
    fctx.beginPath(); fctx.moveTo(0, y); fctx.lineTo(1920, y); fctx.stroke();
  }
}

// ---------- Логотип ----------
const lctx = $("logo").getContext("2d");
let M;
function measure() {
  lctx.font = `700 ${ONE_SIZE}px "Inter Display"`;
  const m = lctx.measureText("1");
  M = {
    oneW: m.actualBoundingBoxRight + m.actualBoundingBoxLeft,
    oneH: m.actualBoundingBoxAscent,
    oneAbl: m.actualBoundingBoxLeft,
  };
  lctx.font = `600 ${WORD_SIZE}px "Inter Display"`;
  M.lw = [...WORD].map(ch => lctx.measureText(ch).width);
  M.capH = lctx.measureText("С").actualBoundingBoxAscent;
}

// «1»: лицевая грань — светлое стекло, боковая — глубокий бирюзовый (объём без фаски)
function drawOne(t, alpha, scale, ang, depth) {
  const ctx = lctx;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(960, ONE_CY); ctx.scale(scale, scale);
  ctx.font = `700 ${ONE_SIZE}px "Inter Display"`;
  const x0 = M.oneAbl - M.oneW / 2, y0 = M.oneH / 2;
  const dx = Math.cos(ang), dy = Math.sin(ang);
  for (let i = Math.round(depth); i >= 1; i--) {
    const k = i / Math.max(1, depth);
    ctx.fillStyle = `rgb(${Math.round(lerp(10, 2, k))},${Math.round(lerp(150, 58, k))},${Math.round(lerp(172, 72, k))})`;
    ctx.fillText("1", x0 + dx * i, y0 + dy * i);
  }
  const g = ctx.createLinearGradient(0, -M.oneH / 2, 0, M.oneH / 2);
  g.addColorStop(0, "#ffffff"); g.addColorStop(0.55, "#e6fbfe"); g.addColorStop(1, "#9fe7f1");
  ctx.fillStyle = g;
  ctx.fillText("1", x0, y0);
  ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(255,255,255,.7)";
  ctx.strokeText("1", x0, y0);
  ctx.restore();
}

function drawWord(t) {
  const ctx = lctx;
  const w = eo4(prog(t, WORD0, WORD0 + 1.6));
  if (w <= 0) return null;
  const track = lerp(1.1, TRACK_FINAL, w) * WORD_SIZE;
  const total = M.lw.reduce((a, b) => a + b, 0) + track * (M.lw.length - 1);
  let x = 960 - total / 2;
  ctx.save();
  ctx.font = `600 ${WORD_SIZE}px "Inter Display"`;
  ctx.fillStyle = "#ffffff";
  [...WORD].forEach((ch, k) => {
    const lk = eo3(prog(t, WORD0 + k * 0.07, WORD0 + 0.9 + k * 0.07));
    ctx.globalAlpha = lk;
    ctx.fillText(ch, x, WORD_Y + lerp(10, 0, lk));
    x += M.lw[k] + track;
  });
  ctx.restore();
  return { left: 960 - total / 2, right: 960 + total / 2 - 0 };
}

function drawRules(t, word) {
  const ctx = lctx;
  const r = eio3(prog(t, WORD0 + 0.5, WORD0 + 1.9));
  if (r <= 0 || !word) return;
  const y = WORD_Y - M.capH / 2;
  const len = 210 * r, gap = 56;
  ctx.save();
  ctx.lineWidth = 2;
  const gl = ctx.createLinearGradient(word.left - gap - 210, 0, word.left - gap, 0);
  gl.addColorStop(0, "rgba(0,178,202,0)"); gl.addColorStop(1, "rgba(0,178,202,.95)");
  ctx.strokeStyle = gl;
  ctx.beginPath(); ctx.moveTo(word.left - gap, y); ctx.lineTo(word.left - gap - len, y); ctx.stroke();
  const gr = ctx.createLinearGradient(word.right + gap, 0, word.right + gap + 210, 0);
  gr.addColorStop(0, "rgba(0,178,202,.95)"); gr.addColorStop(1, "rgba(0,178,202,0)");
  ctx.strokeStyle = gr;
  ctx.beginPath(); ctx.moveTo(word.right + gap, y); ctx.lineTo(word.right + gap + len, y); ctx.stroke();
  // жёлтый акцент — короткая черта под словом, как «росток» в знаке ERTIS
  const yk = eo3(prog(t, WORD0 + 1.2, WORD0 + 2.0));
  ctx.fillStyle = "#fddb27";
  ctx.globalAlpha = yk;
  ctx.fillRect(960 - 28 * yk, WORD_Y + 34, 56 * yk, 4);
  ctx.restore();
}

// Горизонтальный блик-«анаморф» в момент появления «1» и блик по логотипу
const fl = $("flare").getContext("2d");
function flare(t) {
  fl.clearRect(0, 0, 1920, 1080);
  const a = prog(t, REVEAL - 0.15, REVEAL + 0.1) * (1 - eo3(prog(t, REVEAL + 0.1, REVEAL + 1.6)));
  if (a > 0) {
    const g = fl.createRadialGradient(960, ONE_CY, 0, 960, ONE_CY, 900);
    g.addColorStop(0, `rgba(190,245,255,${0.55 * a})`);
    g.addColorStop(0.08, `rgba(0,178,202,${0.25 * a})`);
    g.addColorStop(1, "rgba(0,178,202,0)");
    fl.save(); fl.translate(960, ONE_CY); fl.scale(1, 0.035); fl.translate(-960, -ONE_CY);
    fl.fillStyle = g; fl.fillRect(0, 0, 1920, 1080); fl.restore();
    const c = fl.createRadialGradient(960, ONE_CY, 0, 960, ONE_CY, 260);
    c.addColorStop(0, `rgba(220,250,255,${0.35 * a})`); c.addColorStop(1, "rgba(0,178,202,0)");
    fl.fillStyle = c; fl.fillRect(0, 0, 1920, 1080);
  }
}

function shine(t) {
  const s = prog(t, SHINE, SHINE + 1.4);
  if (s <= 0 || s >= 1) return;
  const ctx = lctx;
  const x = lerp(500, 1420, eio2(s));
  const g = ctx.createLinearGradient(x - 120, 0, x + 120, 0);
  g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(0.5, "rgba(255,255,255,.85)"); g.addColorStop(1, "rgba(255,255,255,0)");
  ctx.save();
  ctx.globalCompositeOperation = "source-atop";
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.transform(1, 0, -0.3, 1, 0, 0);
  ctx.fillStyle = g; ctx.fillRect(x - 400, 0, 1200, 1080);
  ctx.restore();
}

const gctx = $("grain").getContext("2d");
const gimg = gctx.createImageData(960, 540);
function grain(frame) {
  let s = ((frame + 5) * 2654435761) >>> 0;
  const d = gimg.data;
  for (let i = 0; i < d.length; i += 4) {
    s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0;
    d[i] = d[i + 1] = d[i + 2] = s & 255; d[i + 3] = 255;
  }
  gctx.putImageData(gimg, 0, 0);
}

window.DURATION = END;
window.render = function (t, fps = 25) {
  if (!M) measure();

  // Камера: плавный пролёт вперёд с лёгким поворотом, к логотипу замедляется
  const fly = eio3(prog(t, 0, REVEAL + 1.2));
  const camZ = lerp(-200, 2300, fly) + t * 25;
  const camRY = lerp(-9, 0, fly) + Math.sin(t * 0.4) * 0.6;
  const camX = lerp(160, 0, fly);
  $("cam").style.transform = `rotateY(${camRY}deg) translate3d(${-camX}px, 0, ${camZ}px)`;
  panels.forEach(p => {
    const z = p.z;
    const worldZ = z + camZ;                       // расстояние до камеры
    const near = clamp((worldZ - 300) / 700);       // близко к камере — исчезает
    const far = clamp((worldZ + 4200) / 1600);      // далеко — проявляется из темноты
    const settle = eo3(prog(t, REVEAL - 0.3, REVEAL + 1.5));
    let op = far * (1 - near) * lerp(1, 0.35, settle);
    p.el.style.opacity = op.toFixed(3);
    p.el.style.transform =
      `translate3d(${p.x + p.drift * t}px, ${p.y}px, ${z}px) rotateY(${p.ry}deg)`;
    p.el.style.filter = settle > 0.01 ? `blur(${(settle * 6).toFixed(1)}px)` : "none";
  });

  const intro = eio2(prog(t, 0, 1.6));
  floor(t, intro * lerp(1, 0.7, eo3(prog(t, REVEAL, REVEAL + 2))));
  $("beam").style.opacity = lerp(0.2, 1, eio2(prog(t, REVEAL - 1, REVEAL + 0.6)));

  // Логотип
  lctx.setTransform(1, 0, 0, 1, 0, 0);
  lctx.clearRect(0, 0, 1920, 1080);
  const r = eo4(prog(t, REVEAL, REVEAL + 1.4));
  if (r > 0) {
    const ang = lerp(0.35, 0.8, eio2(prog(t, REVEAL, END)));   // грань «поворачивается» — ощущение объёма
    drawOne(t, r, lerp(1.12, 1, r) * lerp(1, 0.985, prog(t, REVEAL + 1.4, END)), ang, lerp(0, 24, eo3(prog(t, REVEAL + 0.1, REVEAL + 1.6))));
  }
  const word = drawWord(t);
  shine(t);
  drawRules(t, word);
  flare(t);

  $("stage").style.filter = `brightness(${(1 - eio2(prog(t, END - 0.7, END))) * lerp(0, 1, eio2(prog(t, 0, 0.6)))})`;
  grain(Math.round(t * fps));
};

document.fonts.load(`700 ${ONE_SIZE}px "Inter Display"`)
  .then(() => document.fonts.load(`600 ${WORD_SIZE}px "Inter Display"`))
  .then(() => document.fonts.ready)
  .then(() => { measure(); window.render(0); window.READY = true; });
</script>
</body>
</html>
