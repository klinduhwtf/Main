<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>1 СТУДИЯ — заставка, вариант 4</title>
<style>
  /* Синяя гамма (как в нынешнем оформлении передачи), акцентные линии — бирюзовый ERTIS */
  :root {
    --deep: #020a1e;
    --deep2: #0b3a7a;
  }
  html, body { margin: 0; background: #000; }
  #stage {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background:
      radial-gradient(ellipse 60% 45% at 50% 46%, rgba(30,120,210,.45) 0%, rgba(30,120,210,0) 70%),
      radial-gradient(ellipse 90% 75% at 50% 42%, var(--deep2) 0%, var(--deep) 80%);
  }
  #floor { position: absolute; left: 0; top: 0; }
  #world { position: absolute; inset: 0; perspective: 1300px; perspective-origin: 50% 46%; }
  #cam { position: absolute; left: 960px; top: 500px; transform-style: preserve-3d; }
  .panel {
    position: absolute; transform-style: preserve-3d; box-sizing: border-box;
    border: 1.5px solid rgba(150,205,255,.45);
    background: linear-gradient(135deg, rgba(70,160,255,.16), rgba(70,160,255,.03) 60%, rgba(255,255,255,.06));
    box-shadow: inset 0 0 40px rgba(70,160,255,.08);
  }
  #beam {
    position: absolute; left: 960px; top: -300px; width: 900px; height: 1500px; margin-left: -450px;
    background: radial-gradient(ellipse 30% 60% at 50% 0%, rgba(175,215,255,.24), rgba(175,215,255,0) 70%);
    filter: blur(20px);
  }
  #logo, #flare { position: absolute; left: 0; top: 0; }
  #flare { mix-blend-mode: screen; }
  #grain { position: absolute; left: 0; top: 0; opacity: .04; mix-blend-mode: screen; }
  #vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(0,0,0,.65) 100%);
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="floor" width="1920" height="1080"></canvas>
  <div id="beam"></div>
  <div id="world"><div id="cam"></div></div>
  <canvas id="logo" width="1920" height="1080"></canvas>
  <canvas id="flare" width="1920" height="1080"></canvas>
  <canvas id="grain" width="960" height="540" style="width:1920px;height:1080px"></canvas>
  <div id="vignette"></div>
</div>

<script>
// ---------- Тайминги (совпадают со звуком zvuk_v4.py) ----------
const REVEAL = 3.2;   // появляется «1»
const WORD0 = 4.4;    // появляется «СТУДИЯ»
const SHINE = 5.8;    // блик по логотипу
const END = 9.0;

// ---------- Типографика и сетка ----------
// Все отступы считаются от размеров знаков, композиция центрируется по реальным границам.
const WORD = "СТУДИЯ";
const ONE_SIZE = 420;           // кегль «1»
const WORD_SIZE = 84;           // кегль «СТУДИЯ»
const TRACK = 0.40;             // разрядка в финале, доля кегля
const GAP_1_WORD = 1.1;         // отступ «1» → «СТУДИЯ», в высотах прописной буквы слова
const RULE_GAP = 1.0;           // отступ линии от слова, в высотах прописной
const RULE_LEN = 2.6;           // длина линии, в высотах прописной
const OPTICAL_Y = -12;          // группа чуть выше геометрического центра — так она выглядит по центру
const DEPTH = 22;               // глубина объёма «1», px

const COL = {
  face0: "#ffffff", face1: "#e8f3ff", face2: "#a9d4ff",
  sideNear: [24, 112, 210], sideFar: [6, 34, 84],
  rule: "0,178,202",
};

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, t0, t1) => clamp((t - t0) / (t1 - t0));
const lerp = (a, b, k) => a + (b - a) * k;
const eio2 = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const eio3 = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eo3 = k => 1 - Math.pow(1 - k, 3);
const eo4 = k => 1 - Math.pow(1 - k, 4);
const $ = id => document.getElementById(id);

// ---------- Стеклянные панели в 3D ----------
let seed = 20261104;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const panels = [];
for (let i = 0; i < 30; i++) {
  const side = i % 2 ? 1 : -1;
  const p = {
    x: side * lerp(180, 1500, rnd()), y: lerp(-520, 640, rnd()), z: lerp(-3800, 300, rnd()),
    w: lerp(120, 520, rnd()), h: lerp(90, 620, rnd()), ry: side * lerp(8, 35, rnd()),
    drift: lerp(-30, 30, rnd()),
  };
  const el = document.createElement("div"); el.className = "panel";
  el.style.width = p.w + "px"; el.style.height = p.h + "px";
  el.style.marginLeft = -p.w / 2 + "px"; el.style.marginTop = -p.h / 2 + "px";
  $("cam").appendChild(el); p.el = el; panels.push(p);
}

// ---------- Пол ----------
const fctx = $("floor").getContext("2d");
function floor(t, a) {
  fctx.clearRect(0, 0, 1920, 1080);
  const hz = 610, vx = 960;
  fctx.lineWidth = 1;
  for (let i = -24; i <= 24; i++) {
    const xb = vx + i * 140;
    const g = fctx.createLinearGradient(0, hz, 0, 1080);
    g.addColorStop(0, "rgba(90,170,255,0)"); g.addColorStop(1, `rgba(90,170,255,${0.2 * a})`);
    fctx.strokeStyle = g;
    fctx.beginPath(); fctx.moveTo(vx + i * 6, hz); fctx.lineTo(xb + (xb - vx) * 1.6, 1080); fctx.stroke();
  }
  const off = (t * 0.22) % 1;
  for (let j = 0; j < 14; j++) {
    const k = (j + off) / 14;
    const y = hz + Math.pow(k, 2.4) * (1080 - hz);
    fctx.strokeStyle = `rgba(90,170,255,${0.14 * a * k})`;
    fctx.beginPath(); fctx.moveTo(0, y); fctx.lineTo(1920, y); fctx.stroke();
  }
}

// ---------- Измерения и раскладка ----------
const lctx = $("logo").getContext("2d");
const FONT_ONE = `700 ${ONE_SIZE}px "Inter Display"`;
const FONT_WORD = `600 ${WORD_SIZE}px "Inter Display"`;
let M;

function measure() {
  lctx.font = FONT_ONE;
  const m = lctx.measureText("1");
  const one = {
    abl: m.actualBoundingBoxLeft, abr: m.actualBoundingBoxRight, h: m.actualBoundingBoxAscent,
  };
  one.w = one.abl + one.abr;
  // Оптический центр «1»: у знака «флажок» слева, основная масса — штамб справа.
  // Сдвигаем знак на половину разницы между центром габарита и центром масс.
  const oc = document.createElement("canvas"); oc.width = 600; oc.height = 600;
  const o = oc.getContext("2d"); o.font = FONT_ONE; o.fillStyle = "#000";
  o.fillText("1", 300 - one.w / 2 + one.abl, 300 + one.h / 2);
  const d = o.getImageData(0, 0, 600, 600).data;
  let sum = 0, sx = 0;
  for (let y = 0; y < 600; y++) for (let x = 0; x < 600; x++) { const a = d[(y * 600 + x) * 4 + 3]; sum += a; sx += a * x; }
  one.optical = -(sx / sum - 300) * 0.7;

  lctx.font = FONT_WORD;
  const letters = [...WORD].map(ch => {
    const mm = lctx.measureText(ch);
    return { ch, adv: mm.width, abl: mm.actualBoundingBoxLeft, abr: mm.actualBoundingBoxRight };
  });
  const capH = lctx.measureText("Н").actualBoundingBoxAscent;

  // Вертикаль: [верх «1»] — отступ — [высота прописных слова]; хвосты «Д» в расчёт не входят
  const gap = capH * GAP_1_WORD;
  const total = one.h + gap + capH;
  const top = 540 + OPTICAL_Y - total / 2;
  M = {
    one, letters, capH,
    oneTop: top, oneBase: top + one.h,
    wordBase: top + one.h + gap + capH,
  };
}

// Раскладка слова при текущей разрядке: центрируется по чернилам первой и последней буквы
function wordLayout(track) {
  const L = M.letters;
  const xs = []; let x = 0;
  L.forEach((l, i) => { xs.push(x); x += l.adv + (i < L.length - 1 ? track : 0); });
  const inkL = xs[0] - L[0].abl;
  const inkR = xs[L.length - 1] + L[L.length - 1].abr;
  const shift = 960 - (inkL + inkR) / 2;
  return { xs: xs.map(v => v + shift), left: inkL + shift, right: inkR + shift };
}

// ---------- «1» с объёмом ----------
function drawOne(alpha, scale, ang, depth) {
  const ctx = lctx, O = M.one;
  const cy = M.oneTop + O.h / 2;
  const dx = Math.cos(ang), dy = Math.sin(ang);
  // объём смещает визуальную массу вправо-вниз — компенсируем половину
  const cxShift = O.optical - dx * depth * 0.5;
  const cyShift = -dy * depth * 0.5;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(960 + cxShift, cy + cyShift);
  ctx.scale(scale, scale);
  ctx.font = FONT_ONE;
  const x0 = O.abl - O.w / 2, y0 = O.h / 2;
  for (let i = Math.round(depth); i >= 1; i--) {
    const k = i / Math.max(1, depth);
    const c = COL.sideNear.map((v, j) => Math.round(lerp(v, COL.sideFar[j], k)));
    ctx.fillStyle = `rgb(${c})`;
    ctx.fillText("1", x0 + dx * i, y0 + dy * i);
  }
  const g = ctx.createLinearGradient(0, -O.h / 2, 0, O.h / 2);
  g.addColorStop(0, COL.face0); g.addColorStop(0.55, COL.face1); g.addColorStop(1, COL.face2);
  ctx.fillStyle = g;
  ctx.fillText("1", x0, y0);
  ctx.lineWidth = 1.2; ctx.strokeStyle = "rgba(255,255,255,.65)";
  ctx.strokeText("1", x0, y0);
  ctx.restore();
}

function drawWord(t) {
  const w = eo4(prog(t, WORD0, WORD0 + 1.6));
  if (w <= 0) return null;
  const lay = wordLayout(lerp(1.1, TRACK, w) * WORD_SIZE);
  const ctx = lctx;
  ctx.save();
  ctx.font = FONT_WORD; ctx.fillStyle = "#ffffff";
  M.letters.forEach((l, k) => {
    const lk = eo3(prog(t, WORD0 + k * 0.07, WORD0 + 0.9 + k * 0.07));
    ctx.globalAlpha = lk;
    ctx.fillText(l.ch, lay.xs[k], M.wordBase);
  });
  ctx.restore();
  return lay;
}

// Боковые линии — от финальных границ слова, строго по середине высоты прописных
function drawRules(t) {
  const r = eio3(prog(t, WORD0 + 0.6, WORD0 + 2.0));
  if (r <= 0) return;
  const fin = wordLayout(TRACK * WORD_SIZE);
  const ctx = lctx;
  const y = Math.round(M.wordBase - M.capH / 2) + 0.5;   // ровно на пиксельную сетку
  const gap = M.capH * RULE_GAP, len = M.capH * RULE_LEN * r;
  ctx.save();
  ctx.lineWidth = 2; ctx.lineCap = "butt";
  [[fin.left - gap, -1], [fin.right + gap, 1]].forEach(([x, dir]) => {
    const g = ctx.createLinearGradient(x, 0, x + dir * M.capH * RULE_LEN, 0);
    g.addColorStop(0, `rgba(${COL.rule},.95)`); g.addColorStop(1, `rgba(${COL.rule},0)`);
    ctx.strokeStyle = g;
    ctx.beginPath(); ctx.moveTo(Math.round(x), y); ctx.lineTo(Math.round(x + dir * len), y); ctx.stroke();
  });
  ctx.restore();
}

// ---------- Блики ----------
const fl = $("flare").getContext("2d");
function flare(t) {
  fl.clearRect(0, 0, 1920, 1080);
  const a = prog(t, REVEAL - 0.15, REVEAL + 0.1) * (1 - eo3(prog(t, REVEAL + 0.1, REVEAL + 1.6)));
  if (a <= 0) return;
  const cy = M.oneTop + M.one.h / 2;
  const g = fl.createRadialGradient(960, cy, 0, 960, cy, 900);
  g.addColorStop(0, `rgba(200,230,255,${0.55 * a})`);
  g.addColorStop(0.08, `rgba(70,160,255,${0.25 * a})`);
  g.addColorStop(1, "rgba(70,160,255,0)");
  fl.save(); fl.translate(960, cy); fl.scale(1, 0.035); fl.translate(-960, -cy);
  fl.fillStyle = g; fl.fillRect(0, 0, 1920, 1080); fl.restore();
  const c = fl.createRadialGradient(960, cy, 0, 960, cy, 260);
  c.addColorStop(0, `rgba(220,240,255,${0.35 * a})`); c.addColorStop(1, "rgba(70,160,255,0)");
  fl.fillStyle = c; fl.fillRect(0, 0, 1920, 1080);
}

function shine(t) {
  const s = prog(t, SHINE, SHINE + 1.4);
  if (s <= 0 || s >= 1) return;
  const ctx = lctx;
  const x = lerp(560, 1360, eio2(s));
  const g = ctx.createLinearGradient(x - 120, 0, x + 120, 0);
  g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(0.5, "rgba(255,255,255,.8)"); g.addColorStop(1, "rgba(255,255,255,0)");
  ctx.save();
  ctx.globalCompositeOperation = "source-atop";
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.transform(1, 0, -0.3, 1, 0, 0);
  ctx.fillStyle = g; ctx.fillRect(x - 400, 0, 1200, 1080);
  ctx.restore();
}

const gctx = $("grain").getContext("2d");
const gimg = gctx.createImageData(960, 540);
function grain(frame) {
  let s = ((frame + 5) * 2654435761) >>> 0;
  const d = gimg.data;
  for (let i = 0; i < d.length; i += 4) {
    s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0;
    d[i] = d[i + 1] = d[i + 2] = s & 255; d[i + 3] = 255;
  }
  gctx.putImageData(gimg, 0, 0);
}

window.DURATION = END;
window.render = function (t, fps = 25) {
  if (!M) measure();

  const fly = eio3(prog(t, 0, REVEAL + 1.2));
  const camZ = lerp(-200, 2300, fly) + t * 25;
  const camRY = lerp(-9, 0, fly) + Math.sin(t * 0.4) * 0.6;
  const camX = lerp(160, 0, fly);
  $("cam").style.transform = `rotateY(${camRY}deg) translate3d(${-camX}px, 0, ${camZ}px)`;
  const settle = eo3(prog(t, REVEAL - 0.3, REVEAL + 1.5));
  panels.forEach(p => {
    const worldZ = p.z + camZ;
    const near = clamp((worldZ - 300) / 700);
    const far = clamp((worldZ + 4200) / 1600);
    p.el.style.opacity = (far * (1 - near) * lerp(1, 0.32, settle)).toFixed(3);
    p.el.style.transform = `translate3d(${p.x + p.drift * t}px, ${p.y}px, ${p.z}px) rotateY(${p.ry}deg)`;
    p.el.style.filter = settle > 0.01 ? `blur(${(settle * 6).toFixed(1)}px)` : "none";
  });

  floor(t, eio2(prog(t, 0, 1.6)) * lerp(1, 0.65, eo3(prog(t, REVEAL, REVEAL + 2))));
  $("beam").style.opacity = lerp(0.2, 1, eio2(prog(t, REVEAL - 1, REVEAL + 0.6)));

  lctx.setTransform(1, 0, 0, 1, 0, 0);
  lctx.clearRect(0, 0, 1920, 1080);
  const r = eo4(prog(t, REVEAL, REVEAL + 1.4));
  if (r > 0) {
    const ang = lerp(0.45, 0.85, eio2(prog(t, REVEAL, END)));
    const depth = lerp(0, DEPTH, eo3(prog(t, REVEAL + 0.1, REVEAL + 1.6)));
    drawOne(r, lerp(1.1, 1, r), ang, depth);
  }
  drawWord(t);
  shine(t);
  drawRules(t);
  flare(t);

  $("stage").style.filter = `brightness(${(1 - eio2(prog(t, END - 0.7, END))) * eio2(prog(t, 0, 0.6))})`;
  grain(Math.round(t * fps));
};

// Отладка сетки: render(t) затем showGrid() — рисует центральные оси и границы групп
window.showGrid = function () {
  const c = lctx; c.save(); c.strokeStyle = "rgba(255,0,80,.8)"; c.lineWidth = 1;
  const fin = wordLayout(TRACK * WORD_SIZE);
  [[960, 0, 960, 1080], [0, 540, 1920, 540], [0, M.oneTop, 1920, M.oneTop], [0, M.oneBase, 1920, M.oneBase],
   [0, M.wordBase - M.capH, 1920, M.wordBase - M.capH], [0, M.wordBase, 1920, M.wordBase],
   [fin.left, 0, fin.left, 1080], [fin.right, 0, fin.right, 1080]]
    .forEach(([a, b, x, y]) => { c.beginPath(); c.moveTo(a + .5, b + .5); c.lineTo(x + .5, y + .5); c.stroke(); });
  c.restore();
};

document.fonts.load(FONT_ONE).then(() => document.fonts.load(FONT_WORD))
  .then(() => document.fonts.ready)
  .then(() => { measure(); window.render(0); window.READY = true; });
</script>
</body>
</html>
