<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ТЕЛЕЦЕНТР — заставка «Два голоса»</title>
<style>
  /* Светлая тёплая гамма, бирюзовый и жёлтый — цвета ERTIS, тёмные чернила для слова */
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #f3f0e9; }
  canvas { position: absolute; left: 0; top: 0; }
  #paper { opacity: .05; mix-blend-mode: multiply; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <canvas id="main" width="1920" height="1080"></canvas>
  <canvas id="paper" width="960" height="540" style="width:1920px;height:1080px"></canvas>
  <canvas id="wipe" width="1920" height="1080"></canvas>
</div>

<script>
// ---------- Тайминги (совпадают со звуком zvuk.py) ----------
const VOICE_L = 0.15;   // левый голос входит в кадр
const VOICE_R = 0.55;   // правый голос отвечает
const MEET = 1.8;       // голоса встречаются в центре: вырастает узор, вспыхивает «лист»
const HORNS = 3.0;      // узор дорисован
const SETTLE0 = 3.0, SETTLE1 = 4.0;   // узор уходит наверх, уступая место слову
const WORD0 = 3.45;     // буквы «ТЕЛЕЦЕНТР»
const LINE0 = 4.3;      // живая линия голоса под словом
const WIPE = 7.8;       // бирюзовая шторка — переход в студию
const END = 8.6;

const C = {
  paper: "#f3f0e9", ink: "#0f2830", tq: "#00a3b8", tqRGB: "0,163,184", yellow: "#fdd327",
};
const WORD = "ТЕЛЕЦЕНТР";
const WORD_SIZE = 112;
const TRACK = 0.06;          // разрядка, доля кегля
const ORN_FINAL = 1.08;      // масштаб узора в финале
const ORN_BIG = 1.7;        // масштаб узора в момент встречи
const STROKE = 11;            // толщина линии узора при масштабе 1

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, t0, t1) => clamp((t - t0) / (t1 - t0));
const lerp = (a, b, k) => a + (b - a) * k;
const eio2 = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const eio3 = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eo3 = k => 1 - Math.pow(1 - k, 3);
const eo4 = k => 1 - Math.pow(1 - k, 4);
const eoBack = k => 1 + 2.2 * Math.pow(k - 1, 3) + 1.2 * Math.pow(k - 1, 2);
const $ = id => document.getElementById(id);

// ---------- Узор «қошқар мүйіз»: стебель и четыре завитка (локальные координаты) ----------
// Центр узла — (0, KNOT). Верхние рога завиваются наружу и вниз, нижние — наружу и вверх.
const KNOT = -25;
function spiral(cx, cy, r0, r1, sweep, dir, n = 90) {
  const pts = [], k = Math.log(r0 / r1);
  for (let i = 0; i <= n; i++) {
    const u = i / n, r = r0 * Math.exp(-k * u), f = Math.PI + dir * sweep * u;
    pts.push([cx + r * Math.cos(f), cy + r * Math.sin(f)]);
  }
  return pts;
}
const mirror = pts => pts.map(([x, y]) => [-x, y]);
const ORN = (() => {
  const up = spiral(84, -84, 84, 13, 2.45 * Math.PI, 1);      // верхний правый рог
  const lo = spiral(40, 34, 40, 9, 2.3 * Math.PI, -1);      // нижний правый рог
  return [
    { pts: [[0, KNOT], [0, -84]], t0: 0, t1: 0.3 },
    { pts: [[0, KNOT], [0, 34]], t0: 0, t1: 0.25 },
    { pts: up, t0: 0.22, t1: 1 }, { pts: mirror(up), t0: 0.22, t1: 1 },
    { pts: lo, t0: 0.18, t1: 0.85 }, { pts: mirror(lo), t0: 0.18, t1: 0.85 },
  ].map(s => {
    const lens = [0];
    for (let i = 1; i < s.pts.length; i++) lens.push(lens[i - 1] + Math.hypot(s.pts[i][0] - s.pts[i - 1][0], s.pts[i][1] - s.pts[i - 1][1]));
    return { ...s, lens, len: lens[lens.length - 1] };
  });
})();
const ORN_TOP = -174, ORN_BOTTOM = 80;   // габарит узора

function partial(ctx, s, k) {
  const target = s.len * k;
  ctx.moveTo(s.pts[0][0], s.pts[0][1]);
  for (let i = 1; i < s.pts.length; i++) {
    if (s.lens[i] <= target) { ctx.lineTo(s.pts[i][0], s.pts[i][1]); continue; }
    const f = (target - s.lens[i - 1]) / (s.lens[i] - s.lens[i - 1]);
    ctx.lineTo(lerp(s.pts[i - 1][0], s.pts[i][0], f), lerp(s.pts[i - 1][1], s.pts[i][1], f));
    break;
  }
}

// «Лист» — знак той же формы, что у логотипа ERTIS: два противоположных угла скруглены
function leaf(ctx, x, y, s) {
  const h = s / 2, r = s * 0.62;
  ctx.beginPath();
  ctx.moveTo(x - h, y + h);
  ctx.lineTo(x - h, y - h + r); ctx.arcTo(x - h, y - h, x - h + r, y - h, r);
  ctx.lineTo(x + h, y - h);
  ctx.lineTo(x + h, y + h - r); ctx.arcTo(x + h, y + h, x + h - r, y + h, r);
  ctx.closePath();
}

// ---------- Раскладка финала ----------
const ctx = $("main").getContext("2d");
const FONT = `700 ${WORD_SIZE}px "Inter Display"`;
let M;
function measure() {
  ctx.font = FONT;
  const letters = [...WORD].map(ch => { const m = ctx.measureText(ch); return { ch, adv: m.width, abl: m.actualBoundingBoxLeft, abr: m.actualBoundingBoxRight }; });
  const capH = ctx.measureText("Н").actualBoundingBoxAscent;
  const ornH = (ORN_BOTTOM - ORN_TOP) * ORN_FINAL;
  const gap = capH * 0.85, lineGap = capH * 0.6, lineAmp = 12;
  const total = ornH + gap + capH + lineGap + lineAmp;
  const top = 540 - 10 - total / 2;
  const track = TRACK * WORD_SIZE;
  const xs = []; let x = 0;
  letters.forEach((l, i) => { xs.push(x); x += l.adv + (i < letters.length - 1 ? track : 0); });
  const inkL = xs[0] - letters[0].abl, inkR = xs.at(-1) + letters.at(-1).abr;
  const shift = 960 - (inkL + inkR) / 2;
  M = {
    letters, capH, xs: xs.map(v => v + shift), left: inkL + shift, right: inkR + shift,
    ornY: top - ORN_TOP * ORN_FINAL,                      // начало координат узора в финале
    base: top + ornH + gap + capH,
    lineY: top + ornH + gap + capH + lineGap + lineAmp / 2,
  };
  // в момент встречи узел стоит в центре кадра
  M.ornYBig = 540 - KNOT * ORN_BIG;
  M.voiceY = 540;
}

// ---------- Голоса: волна речи с неровной огибающей ----------
function speech(x, t, seed) {
  // «слоги»: огибающая из нескольких синусов, сама волна — частая
  const env = Math.max(0, Math.sin(x * 0.011 + seed) * 0.6 + Math.sin(x * 0.027 + seed * 2.3 + t * 2) * 0.5 + 0.25);
  return env * Math.sin(x * 0.16 - t * 22 + seed);
}
function voice(t, side) {
  const t0 = side < 0 ? VOICE_L : VOICE_R;
  const head = eio2(prog(t, t0, MEET));                       // голова линии: от края к центру
  const tail = eio3(prog(t, MEET - 0.05, MEET + 0.55));       // после встречи хвост втягивается в узел
  if (head <= 0 || tail >= 1) return;
  const xEdge = side < 0 ? -40 : 1960;
  const hx = lerp(xEdge, 960, head), tx = lerp(xEdge, 960, tail);
  ctx.save();
  ctx.strokeStyle = C.tq; ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath();
  const n = 260;
  for (let i = 0; i <= n; i++) {
    const x = lerp(tx, hx, i / n);
    const nearHead = clamp(Math.abs(hx - x) / 220);           // к голове волна затихает в точку
    const nearCenter = clamp(Math.abs(960 - x) / 260);        // у центра — прямая, чтобы влиться в узел
    const a = 46 * speech(x * side, t, side < 0 ? 1.3 : 4.1) * nearHead * nearCenter * (1 - tail);
    i ? ctx.lineTo(x, M.voiceY + a) : ctx.moveTo(x, M.voiceY + a);
  }
  ctx.stroke();
  ctx.restore();
}

// ---------- Узор ----------
function ornament(t) {
  const g = prog(t, MEET, HORNS);
  if (g <= 0) return;
  const s = eio3(prog(t, SETTLE0, SETTLE1));
  const sc = lerp(ORN_BIG, ORN_FINAL, s);
  const oy = lerp(M.ornYBig, M.ornY, s);
  ctx.save();
  ctx.translate(960, oy); ctx.scale(sc, sc);
  ctx.strokeStyle = C.tq; ctx.lineWidth = STROKE; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ORN.forEach(seg => {
    const k = eio2(prog(g, seg.t0, seg.t1));
    if (k <= 0) return;
    ctx.beginPath(); partial(ctx, seg, k); ctx.stroke();
  });
  // жёлтый «лист» в узле
  const l = prog(t, MEET + 0.08, MEET + 0.6);
  if (l > 0) {
    const breathe = 1 + 0.04 * Math.sin((t - MEET) * 3.2) * prog(t, HORNS, HORNS + 1);
    const sz = 40 * eoBack(l) * breathe;
    ctx.fillStyle = C.yellow;
    leaf(ctx, 0, KNOT, sz); ctx.fill();
  }
  ctx.restore();
}

// ---------- Слово: буквы выезжают снизу из-под линии основания ----------
function word(t) {
  if (t < WORD0) return;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, 1920, M.base + M.capH * 0.32); ctx.clip();   // маска: хвост «Ц» виден, ниже — нет
  ctx.font = FONT; ctx.fillStyle = C.ink;
  M.letters.forEach((l, i) => {
    const k = eo4(prog(t, WORD0 + i * 0.045, WORD0 + 0.75 + i * 0.045));
    if (k <= 0) return;
    ctx.globalAlpha = clamp(k * 1.6);
    ctx.fillText(l.ch, M.xs[i], M.base + (1 - k) * M.capH * 1.4);
  });
  ctx.restore();
}

// Живая линия голоса под словом — «эфир идёт»
function liveLine(t) {
  const k = eio3(prog(t, LINE0, LINE0 + 1.0));
  if (k <= 0) return;
  const half = (M.right - M.left) / 2 * k;
  ctx.save();
  ctx.strokeStyle = C.tq; ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath();
  const n = 240;
  for (let i = 0; i <= n; i++) {
    const x = 960 - half + 2 * half * i / n;
    const edge = Math.sin(Math.PI * i / n);                    // по краям — тише
    const a = 9 * speech(x, t * 0.6, 2.2) * edge * edge;
    i ? ctx.lineTo(x, M.lineY + a) : ctx.moveTo(x, M.lineY + a);
  }
  ctx.stroke();
  ctx.restore();
}

// ---------- Фон: тёплая бумага, бирюзовый свет и огромный бледный узор ----------
const bg = $("bg").getContext("2d");
function background(t) {
  bg.fillStyle = C.paper; bg.fillRect(0, 0, 1920, 1080);
  const g = bg.createRadialGradient(960, 520, 0, 960, 520, 1100);
  g.addColorStop(0, "rgba(255,255,255,.9)"); g.addColorStop(1, "rgba(255,255,255,0)");
  bg.fillStyle = g; bg.fillRect(0, 0, 1920, 1080);
  const w = bg.createRadialGradient(960, 1250, 0, 960, 1250, 900);
  w.addColorStop(0, `rgba(${C.tqRGB},.10)`); w.addColorStop(1, `rgba(${C.tqRGB},0)`);
  bg.fillStyle = w; bg.fillRect(0, 0, 1920, 1080);
  // бледный большой узор — проявляется после встречи и медленно растёт
  const a = eio2(prog(t, MEET + 0.3, HORNS + 1)) * 0.035;
  if (a > 0) {
    bg.save();
    bg.translate(960, 560); bg.scale(5.2 + t * 0.06, 5.2 + t * 0.06);
    bg.strokeStyle = `rgba(${C.tqRGB},${a})`; bg.lineWidth = 2.2; bg.lineCap = "round";
    ORN.slice(2).forEach(seg => { bg.beginPath(); partial(bg, seg, 1); bg.stroke(); });   // только завитки, без стебля
    bg.restore();
  }
}

// ---------- Шторка: бирюзовая полоса с жёлтой кромкой ----------
const wp = $("wipe").getContext("2d");
function wipe(t) {
  wp.clearRect(0, 0, 1920, 1080);
  const k = eio3(prog(t, WIPE, END - 0.15));
  if (k <= 0) return;
  const x = lerp(-700, 2400, k), skew = 380;
  wp.fillStyle = C.yellow;
  wp.beginPath(); wp.moveTo(-800, 0); wp.lineTo(x + 40, 0); wp.lineTo(x + 40 - skew, 1080); wp.lineTo(-800, 1080); wp.fill();
  wp.fillStyle = C.tq;
  wp.beginPath(); wp.moveTo(-800, 0); wp.lineTo(x, 0); wp.lineTo(x - skew, 1080); wp.lineTo(-800, 1080); wp.fill();
}

// ---------- Зерно бумаги ----------
const pc = $("paper").getContext("2d");
const pimg = pc.createImageData(960, 540);
function paper(frame) {
  let s = ((frame + 11) * 2654435761) >>> 0;
  const d = pimg.data;
  for (let i = 0; i < d.length; i += 4) {
    s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0;
    const v = 128 + (s & 127); d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
  }
  pc.putImageData(pimg, 0, 0);
}

window.DURATION = END;
window.render = function (t, fps = 25) {
  if (!M) measure();
  background(t);
  ctx.clearRect(0, 0, 1920, 1080);
  voice(t, -1); voice(t, 1);
  ornament(t);
  word(t);
  liveLine(t);
  wipe(t);
  paper(Math.round(t * fps));
};

window.showGrid = function () {
  ctx.save(); ctx.strokeStyle = "rgba(255,0,80,.8)"; ctx.lineWidth = 1;
  [[960, 0, 960, 1080], [0, 540, 1920, 540], [0, M.ornY + ORN_TOP * ORN_FINAL, 1920, M.ornY + ORN_TOP * ORN_FINAL],
   [0, M.base - M.capH, 1920, M.base - M.capH], [0, M.base, 1920, M.base], [0, M.lineY, 1920, M.lineY],
   [M.left, 0, M.left, 1080], [M.right, 0, M.right, 1080]]
    .forEach(([a, b, x, y]) => { ctx.beginPath(); ctx.moveTo(a + .5, b + .5); ctx.lineTo(x + .5, y + .5); ctx.stroke(); });
  ctx.restore();
};

document.fonts.load(FONT).then(() => document.fonts.ready)
  .then(() => { measure(); window.render(0); window.READY = true; });
</script>
</body>
</html>
